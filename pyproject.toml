[project]
name = "ytstreetorgan"
dynamic = ["version"]
description = "Street Organ Roll Book Maker"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yoichi Tanibayashi", email = "yoichi@tanibayashi.jp" }]
urls = { Repository = "https://github.com/ytani01/ytstreetorgan/" }
requires-python = ">=3.13"
dependencies = [
  "click",
  "loguru>=0.7.3",
  "pygame-ce",
  "tornado",
  "ytmidilib",
]

[project.scripts]
ytstreetorgan = "ytstreetorgan.__main__:cli"

[dependency-groups]
dev = [
  "basedpyright>=1.37.3",
  "mypy>=1.19.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "pytest-playwright>=0.8.0",
  "ruff>=0.14.14",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingSuperCall = false
reportPossiblyUnboundVariable = "none"
reportMissingImports = "none"
reportOptionalCall = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportDuplicateImport = "warning"
reportUnreachable = "warning"
reportDeprecated = "warning"
useLibraryCodeForTypes = true

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# デフォルト (E4,E7,E9,F) は未使用 import 程度しか拾わないので広げている。
select = ["E4", "E5", "E7", "E9", "F", "I", "UP", "B", "W", "PTH"]

[tool.ruff.lint.per-file-ignores]
# テストはフィクスチャの定義後に import を置くことがある
"tests/*" = ["E402"]

# --- os.path -> pathlib 移行の残作業 ---
# PTH を有効にしたうえで、未移行のファイルだけをここで除外している。
# 1 ファイル移行し終わったら、その行を消す。全部消えたら移行完了。
# 移行済みファイルに os.path が再び入ったら、その時点で ruff が落ちる。
# 数字は設定時点の指摘件数 (`ruff check --select PTH --statistics` で確認)。
"tests/test_webapp_async.py" = ["PTH"]      # 12
"tests/test_webapp.py" = ["PTH"]            # 1
"tests/test_rollbook.py" = ["PTH"]          # 1
"tests/test_main.py" = ["PTH"]              # 1
"src/ytstreetorgan/handler1.py" = ["PTH"]   # 5
"src/ytstreetorgan/webapp.py" = ["PTH"]     # 3
"src/ytstreetorgan/conf.py" = ["PTH"]       # 2 (ほぼ pathlib 化済み)
"src/ytstreetorgan/rollbook.py" = ["PTH"]   # 1

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "click,loguru,loguru.*,pytest,pytest.*,blessed,blessed.*"
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
# ブラウザテストは実ブラウザを起動するため秒単位で遅い。
# 通常の `pytest` からは除外し、`pytest -m browser` で明示的に実行する。
addopts = "-m 'not browser'"
markers = [
  "browser: 実ブラウザを起動するテスト (pytest -m browser で実行)",
]

[tool.uv.sources]
ytmidilib = { git = "https://github.com/ytani01/ytmidilib.git" }
