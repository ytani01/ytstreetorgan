  <summary>「移調」とは？</summary>
  <div class="terms__body">
    <p>
      <b>移調</b>は、曲全体をまとめて高くしたり低くしたりすることです。
      メロディーの形は変わらないので、同じ曲に聞こえます。
      カラオケの「キー +1 / −1」と同じ操作だと思ってください。
