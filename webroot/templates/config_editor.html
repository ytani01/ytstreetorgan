{% extends "base.html" %}

{% block head %}
    <script>
      window.INITIAL_CONF_DATA = {% raw conf_data %};
    </script>
{% end %}

{% block content %}
      <section class="wrap">
        <h1 class="page-title">機種設定</h1>

        <div id="alert-container"></div>

        <div class="toolrow">
          <label for="model-select">編集中</label>
          <select id="model-select">
            {% for m in models %}
            <option value="{{ m }}">{{ m }}</option>
            {% end %}
          </select>
          <button type="button" id="btn-save-config">変更を保存</button>
          <span class="spacer"></span>
          <button type="button" class="secondary outline" id="btn-add-model">
            ＋ 機種を追加
          </button>
          <button type="button" class="secondary outline btn-danger"
            id="btn-delete-model">
            機種を削除
          </button>
        </div>

        <form id="config-form" onsubmit="return false;">
          <!-- 機種名とメモは 2 カラムをまたいで先頭に置く。メモを左カラムの
               末尾に置くと、どの機種の覚え書きなのか目に入らなかった。 -->
          <section class="panel panel--head">
            <h2>機種</h2>
            <div class="panel__body">
              <div class="field">
                <label for="field-model">機種名<small>model</small></label>
                <input type="text" id="field-model" name="model" required>
                <span class="field__unit"></span>
              </div>
              <div class="field field--memo">
                <label for="field-memo">メモ<small>memo</small></label>
                <textarea id="field-memo" name="memo" rows="2"
                  placeholder="この機種についての覚え書き"></textarea>
              </div>
            </div>
          </section>

          <div class="cfg-grid">
            <div>
              <section class="panel">
                <h2>基本寸法</h2>
                <div class="panel__body">
                  <div class="field">
                    <label for="field-book-height">ブック高さ<small>book_height</small></label>
                    <input type="number" step="0.1" id="field-book-height"
                      name="book_height" required>
                    <span class="field__unit">mm</span>
                  </div>
                  <div class="field">
                    <label for="field-margin">マージン<small>margin</small></label>
                    <input type="number" step="0.01" id="field-margin"
                      name="margin" required>
                    <span class="field__unit">mm</span>
                  </div>
                  <div class="field">
                    <label for="field-pitch">ピッチ<small>pitch</small></label>
                    <input type="number" step="0.01" id="field-pitch"
                      name="pitch" required>
                    <span class="field__unit">mm</span>
                  </div>
                  <div class="field">
                    <label for="field-hole-height">穴の高さ<small>hole_height</small></label>
                    <input type="number" step="0.1" id="field-hole-height"
                      name="hole_height" required>
                    <span class="field__unit">mm</span>
                  </div>
                  <div class="field">
                    <label for="field-mm-per-sec">1 秒あたりの長さ<small>mm_per_sec</small></label>
                    <input type="number" step="0.1" id="field-mm-per-sec"
                      name="mm_per_sec" required>
                    <span class="field__unit">mm</span>
                  </div>
                  <div class="field">
                    <label for="field-bridge-width">ブリッジ幅<small>bridge_width</small></label>
                    <input type="number" step="0.1" id="field-bridge-width"
                      name="bridge_width" required>
                    <span class="field__unit">mm</span>
                  </div>
                  <div class="field">
                    <label for="field-bridge-threshold">分割する長さ<small>bridge_threshold</small></label>
                    <input type="number" step="0.1" id="field-bridge-threshold"
                      name="bridge_threshold" required>
                    <span class="field__unit">mm</span>
                  </div>
                </div>
              </section>
            </div>

            <div class="cfg-col--notes">
              <section class="panel">
                <h2>
                  音階マッピング
                  <span class="count" id="note-count-badge">0 トラック</span>
                  <button type="button" class="secondary outline" id="btn-add-note"
                    style="width:auto; margin:0; padding:.35rem .8rem; font-size:.84rem;">
                    ＋ トラックを追加
                  </button>
                </h2>
                <div class="notes-scroll">
                  <table class="notes">
                    <tbody id="note-table-body">
                      <!-- config_editor.js が生成する -->
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </div>
        </form>
      </section>
{% end %}

{% block dialogs %}
    <!-- 機種の追加。Pico は <dialog> をそのまま使う（JS ライブラリ不要） -->
    <dialog id="addModelModal">
      <article>
        <header>
          <button type="button" aria-label="閉じる" rel="prev"
            id="btn-cancel-add-model"></button>
          <h3 style="margin:0;">新規機種の追加</h3>
        </header>
        <label for="new-model-name">機種名</label>
        <input type="text" id="new-model-name" placeholder="例: 26notes">
        <label for="copy-from-model">設定のテンプレート（既存機種からコピー）</label>
        <select id="copy-from-model"></select>
        <p class="dialog-error" id="add-model-error" hidden></p>
        <footer>
          <button type="button" class="secondary" id="btn-close-add-model">
            キャンセル
          </button>
          <button type="button" id="btn-confirm-add-model">追加</button>
        </footer>
      </article>
    </dialog>
{% end %}

{% block scripts %}
    <script src="{{ static_url('js/alert.js') }}"></script>
    <script src="{{ static_url('js/model_store.js') }}"></script>
    <script src="{{ static_url('js/config_editor.js') }}"></script>
{% end %}
